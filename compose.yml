services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litera-app
    restart: unless-stopped
    port:
      -  :80"
    environment:
      APP_NAME: LITERA
      APP_ENV: production
      APP_KEY: base64:EQgJ5pckgxhaqDV4To4z+3z1nSo9dPeb9Z531i4Me7Q=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: litera
      DB_USERNAME: demopass123
      DB_PASSWORD: demopass123
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - litera_storage:/var/www/html/storage/app/public

  db:
    image: mysql:8.4
    container_name: litera-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: litera
      MYSQL_USER: demo_app_db
      MYSQL_PASSWORD: demopass123
      MYSQL_ROOT_PASSWORD: demopass123
    volumes:
      - litera_database:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  litera_database:
  litera_storage:
